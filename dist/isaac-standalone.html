    this.input.update();

    this.music.update();

    // 震屏衰减
    if (this.shake > 0) {
      this.shake = Math.max(0, this.shake - dt * 2.6);
      const amp = this.shake * 9;
      this.shakeX = (Math.random() - 0.5) * amp;
      this.shakeY = (Math.random() - 0.5) * amp;
    } else {
      this.shakeX = 0;
      this.shakeY = 0;
    }
    if (this.damageFlash > 0) this.damageFlash = Math.max(0, this.damageFlash - dt * 1.8);
    if (this.itemPanel) {
      this.itemPanel.t += dt;
      if (this.itemPanel.t > 3.0) this.itemPanel = null;
    }

    switch (this.scene) {
      case SCENE.TITLE:
        this._updateTitle(dt);
        break;
      case SCENE.FLOOR_INTRO:
        this.transitionT += dt;
        if (this.transitionT > 1.8 && this.sceneT > 0.2) {
          this.gotoScene(SCENE.PLAYING);
          this.transitionT = 0;
        }
        break;
      case SCENE.PLAYING:
        this._updatePlaying(dt);
        break;
      case SCENE.PAUSED:
        this._updatePaused(dt);
        break;
      case SCENE.DEAD:
        this.stats.timeAlive = this.stats.timeAlive; // 冻结
        this._updateDead(dt);
        break;
      case SCENE.WIN:
        this._updateWin(dt);
        break;
    }

    // 按钮命中检测（鼠标位置）
    this._updateHover();
  }

  _updateTitle(dt) {
    if (this._confirmPressed()) {
      this.audio.sfxClick();
      this.startGame();
    }
  }

  _updatePaused(dt) {
    // P / ESC 恢复
    if (this.input.pressed('KeyP') || this.input.pressed('Escape')) {
      this.audio.sfxPause();
      this.gotoScene(SCENE.PLAYING);
    }
  }

  _updateDead(dt) {
    // 延迟一点点才响应，避免死亡瞬间误触
    if (this.sceneT > 0.6 && this._confirmPressed()) {
      this.audio.sfxClick();
      this.startGame();
    }
  }

  _updateWin(dt) {
    if (this.sceneT > 0.6 && this._confirmPressed()) {
      this.audio.sfxClick();
      this.startGame();
    }
  }

  /** 主玩法更新 */
  _updatePlaying(dt) {
    const p = this.player;
    const room = this.currentRoom;

    this.stats.timeAlive += dt;

    // 加重变体：房间内有存活敌人时叠加该层的战斗乐器层（对应原作机制）
    this.music.setCombat(room.hasLiveEnemies);

    // ---- 暂停输入 ----
    if (this.input.pressed('KeyP') || this.input.pressed('Escape')) {
      this.audio.sfxPause();
      this.gotoScene(SCENE.PAUSED);
      return;
    }

    // ---- 玩家移动 ----
    this._updatePlayerMovement(dt, p, room);

    // ---- 玩家射击 ----
    this._updatePlayerShooting(dt, p);

    // ---- 敌人 AI ----
    this._updateEnemies(dt, room);

    // ---- Boss ----
    this._updateBossIfAny(dt, room);

    // ---- Boss 击败后的延迟切层 ----
    this._tickBossAdvance(dt);
    // 若本帧因切层/通关改变了场景，必须立即停止本帧剩余玩法更新，
    // 否则会用「旧房间」的引用继续跑拾取/清房逻辑，造成跨场景状态污染。
    if (this.scene !== SCENE.PLAYING) return;

    // ---- 战斗结算 ----
    this.combat.update(dt, { room, player: p });
    if (p.alive) {
      this.combat.resolveContactDamage(p, room);
      this.combat.resolveSpikes(p, room);
    }

    // ---- 掉落物拾取 ----
    this._updatePickups(dt, room, p);

    // ---- 宝箱 ----
    this._updateChests(dt, room, p);

    // ---- 尖刺状态推进 ----
    for (const s of room.spikes) s.phase += dt * 3;

    // ---- 房间清空检测 → 开门 ----
    if (!room.cleared && !room.hasLiveEnemies && room.spawned && !room.inGrace) {
      // 进入房间后给 0.35s 缓冲，避免还在生成就判定清房
      if (room.enterGrace > 0) {
        room.enterGrace -= dt;
      } else {
        this._clearRoom(room);
      }
    } else if (room.enterGrace > 0) {
      room.enterGrace -= dt;
    }

    // ---- 玩家出界 / 门传送 ----
    this._checkDoors(dt, room, p);

    // ---- 边界钳制（不被门吸走时）----
    this._clampPlayer(p, room);

    // ---- 粒子 ----
    this.fx.update(dt);

    // ---- 死亡检测 ----
    if (!p.alive) {
      this.bus.emit(EVT.PLAYER_DIED, null);
      this.audio.sfxGameOver();
      this.addShake(1);
      this.gotoScene(SCENE.DEAD);
    }

    // ---- 玩家动画状态 ----
    p.tick(dt);
  }

  _updatePlayerMovement(dt, p, room) {
    const speed = p.stats.speed;
    const mx = this.input.moveX;
    const my = this.input.moveY;
    // 目标速度
    const targetVx = mx * speed;
    const targetVy = my * speed;
    // 平滑加速（提升手感，避免瞬间满速）
    const accel = Math.min(1, dt * 16);
    p.vx += (targetVx - p.vx) * accel;
    p.vy += (targetVy - p.vy) * accel;

    if (mx !== 0 || my !== 0) {
      // 移动朝向（用于身体倾斜/眼睛朝向的次要参考）
      p.moveFacing = Math.atan2(my, mx);
    }

    // 积分 + 障碍碰撞（分轴处理，实现贴墙滑动）
    let nx = p.x + p.vx * dt;
    if (!room.hitsObstacle(nx, p.y, p.radius)) {
      p.x = nx;
    } else {
      p.vx = 0;
    }
    let ny = p.y + p.vy * dt;
    if (!room.hitsObstacle(p.x, ny, p.radius)) {
      p.y = ny;
    } else {
      p.vy = 0;
    }
  }

  _updatePlayerShooting(dt, p) {
    const weapon = p.weapon;
    const firing = this.input.firing && (this.input.fireX !== 0 || this.input.fireY !== 0);

    if (firing) {
      p.facing = Math.atan2(this.input.fireY, this.input.fireX);
    }

    if (weapon.charge) {
      // 蓄力武器
      if (firing) {
        p.charging = true;
        p.chargeTime = Math.min(p.chargeMax, p.chargeTime + dt);
      } else if (p.charging) {
        // 释放
        const ratio = clamp(p.chargeTime / p.chargeMax, 0, 1);
        if (ratio > 0.15) {
          this.combat.playerFireCharged(p, p.facing, weapon, p.stats, ratio);
        }
        p.charging = false;
        p.chargeTime = 0;
        p.fireCooldown = p.stats.fireDelay;
      }
    } else {
      // 连发武器
      if (p.fireCooldown > 0) p.fireCooldown -= dt;
      if (firing && p.fireCooldown <= 0) {
        this.combat.playerFire(p, p.facing, weapon, p.stats);
        p.fireCooldown = p.stats.fireDelay;
      }
    }
  }

  _updateEnemies(dt, room) {
    const p = this.player;
    const api = this._enemyApi(room);
    for (let i = room.enemies.length - 1; i >= 0; i--) {
      const e = room.enemies[i];
      if (!e.alive) {
        room.enemies.splice(i, 1);
        continue;
      }
      updateEnemyAI(e, dt, p, api);
      if (e.isDead) continue;

      // 击退位移
      e.applyKnockback(dt);

      // 移动 + 障碍/边界碰撞
      const nx = e.x + e.vx * dt;
      const ny = e.y + e.vy * dt;
      let blocked = false;
      if (e.flying) {
        // 飞行敌人无视障碍，但仍受房间边界
        e.x = nx;
        e.y = ny;
      } else {
        if (room.hitsObstacle(nx, e.y, e.radius)) {
          e.vx *= -0.4;
          blocked = true;
        } else e.x = nx;
        if (room.hitsObstacle(e.x, ny, e.radius)) {
          e.vy *= -0.4;
          blocked = true;
        } else e.y = ny;
      }
      if (blocked && e.def.ai === 'chase') {
        e.bumpPause = e.def.wallBumpPause || 0.15;
      }

      // 房间边界（内缩一点，避免贴到墙里）
      const pad = e.radius + PLAY_PAD * 0.4;
      const bx = clamp(e.x, pad, ROOM_W - pad);
      const by = clamp(e.y, pad, ROOM_H - pad);
      const hitX = bx !== e.x;
      const hitY = by !== e.y;
      if (hitX && !e.flying) e.vx *= -0.4;
      if (hitY && !e.flying) e.vy *= -0.4;
      // 对角飞行怪（轰炸蝇）撞墙反弹：翻转对应轴方向
      if (e.def.ai === 'diagonalFlyer') {
        if (hitX) { e.dir.x *= -1; e.vx *= -1; }
        if (hitY) { e.dir.y *= -1; e.vy *= -1; }
      }
      e.x = bx;
      e.y = by;

      // 敌人互相分离（避免叠在一起成一坨）
      for (let j = 0; j < room.enemies.length; j++) {
        if (j === i) continue;
        const o = room.enemies[j];
        if (o.isDead) continue;
        const dx = o.x - e.x;
        const dy = o.y - e.y;
        const d2 = dx * dx + dy * dy;
        const minD = e.radius + o.radius;
        if (d2 > 0.01 && d2 < minD * minD) {
          const d = Math.sqrt(d2);
          const push = (minD - d) * 0.5;
          const ux = dx / d;
          const uy = dy / d;
          e.x -= ux * push;
          e.y -= uy * push;
          o.x += ux * push;
          o.y += uy * push;
        }
      }
    }
  }

  _updateBossIfAny(dt, room) {
    // Boss 在玩家进入 boss 房后生成
    if (room.kind === ROOM_KIND.BOSS && !room.bossSpawned) {
      if (room.visited && room.enterGrace <= 0) {
        const fd = floorDef(this.floor);
        const hpScale = fd.hpScale || (1 + (this.floor - 1) * 0.22);
        room.boss = new Boss(ROOM_W / 2, ROOM_H * 0.42, this.rng, hpScale, fd.boss);
        room.bossSpawned = true;
        room.cleared = false;
        this.audio.sfxBossRoar();
        this.addShake(1);
        this.bus.emit(EVT.BOSS_SPAWNED, room.boss);
      }
      return;
    }
    const b = room.boss;
    if (!b) return;

    // Boss 生命周期兜底：无论伤害来自哪条路径（战斗系统 / 爆炸 / 调试直调），
    // 只要 Boss 的死亡动画播完（alive=false），就在这里统一结算击杀与通关。
    // 这样避免「只有走 Combat 的 ENEMY_DIED 事件才会被统计」的脆弱耦合。
    if (!b.alive) {
      if (!room.bossDefeated) {
        room.bossDefeated = true;
        const e = b;
        this.stats.kills++;
        this.audio.sfxBossDie();
        this.addShake(1.2);
        this.fx.gibBurst(e.x, e.y, 40, '#6f9e6b');
        this.fx.explode(e.x, e.y, 24, 120);
        this.bus.emit(EVT.BOSS_DIED, e);
        this._onBossDefeated();
      }
      return;
    }
    if (!b.isDead) {
      // 活着：跑 AI
    }

    const api = {
      room,
      spawnBullet: this.combat.makeEnemySpawnFn(),
      explode: (x, y, r, dmg, owner) => this.combat.explode(x, y, r, dmg, owner || 'enemy'),
      beam: (x, y, angle, opts) => this.combat.spawnEnemyBeam(x, y, angle, opts),
      spawnEnemy: (type, x, y) => this._spawnEnemy(type, x, y, room),
      shake: (a) => this.addShake(a),
      audioShoot: () => this.audio.tone({ freq: 220, freqEnd: 90, type: 'sawtooth', dur: 0.2, gain: 0.22 }),
      audioLand: () => {
        this.audio.noise({ dur: 0.35, gain: 0.3, filterFrom: 1800, filterTo: 80 });
      },
    };
    updateBoss(b, dt, this.player, api);
  }

  /** 敌人 AI 所需的回调集合（爆炸 / 召唤 / 光束） */
  _enemyApi(room) {
    return {
      spawnBullet: this.combat.makeEnemySpawnFn(),
      explode: (x, y, r, dmg, owner) => this.combat.explode(x, y, r, dmg, owner || 'enemy'),
      beam: (x, y, angle, opts) => this.combat.spawnEnemyBeam(x, y, angle, opts),
      spawnEnemy: (type, x, y) => this._spawnEnemy(type, x, y, room),
    };
  }

  /** 生成一个敌人（供召唤类敌人/Boss 使用）；带数量上限防止失控 */
  _spawnEnemy(type, x, y, room) {
    if (!room) return null;
    if (room.enemies.length >= 16) return null;
    const e = new Enemy(type, x, y, this.rng);
    const fd = floorDef(this.floor);
    e.applyScaling(fd.hpScale || 1, fd.speedScale || 1);
    e.entering = 0.2;
    room.enemies.push(e);
    this.fx.sparkBurst(x, y, 8, '#c04040', 0);
    return e;
  }

  _updatePickups(dt, room, p) {
    for (let i = room.pickups.length - 1; i >= 0; i--) {
      const k = room.pickups[i];
      if (Math.hypot(k.x - p.x, k.y - p.y) < p.radius + 14) {
        this._collectPickup(k);
        room.pickups.splice(i, 1);
      }
    }
    // 地面道具
    for (let i = room.itemDrops.length - 1; i >= 0; i--) {
      const d = room.itemDrops[i];
      if (d.taken) continue;
      if (Math.hypot(d.x - p.x, d.y - p.y) < p.radius + 22) {
        this._grantItem(d.itemId, d.x, d.y);
        room.itemDrops.splice(i, 1);
      }
    }
  }

  _collectPickup(k) {
    switch (k.kind) {
      case 'heart':
        if (this.player.heal(2) > 0) this.fx.pickupSparkle(k.x, k.y, PAL_HEART);
        else return; // 满血不吃
        break;
      case 'soulHeart':
        this.player.addSoulHearts(2);
        this.fx.pickupSparkle(k.x, k.y, '#a8d0e6');
        break;
      case 'coin':
        this.coins++;
        this.fx.pickupSparkle(k.x, k.y, '#f0c944');
        break;
      case 'key':
        this.keys++;
        this.fx.pickupSparkle(k.x, k.y, '#e0b64a');
        break;
      case 'bomb':
        this.bombs++;
        this.fx.pickupSparkle(k.x, k.y, '#8a8a98');
        break;
      default:
        break;
    }
    this.audio.sfxDrop();
  }

  _updateChests(dt, room, p) {
    for (const c of room.chests) {
      if (c.opened) continue;
      if (Math.hypot(c.x - p.x, c.y - p.y) < p.radius + 26) {
        c.opened = true;
        this.audio.sfxDoor();
        this.addShake(0.3);
        // 掉落到地面，玩家走上去拾取
        room.itemDrops.push({ x: c.x, y: c.y + 34, itemId: c.itemId, taken: false, t: 0 });
        this.fx.pickupSparkle(c.x, c.y, '#f3c73f');
      }
    }
  }

  /** 授予道具 */
  _grantItem(itemId, x, y) {
    const item = ITEM_BY_ID[itemId] || rollItem(this.rng, RARITY_WEIGHTS.normalDrop);
    if (!item) return;
    applyItem(this.player, item, this.player.weapon);
    this.stats.itemsPicked++;
    this.itemPanel = { item, t: 0 };
    this.fx.pickupSparkle(x, y, '#f3c73f');
    this.audio.sfxPickup();
    this.bus.emit(EVT.ITEM_PICKED, item);
    this.bus.emit(EVT.STATS_CHANGED, this.player.stats);
  }

  /** 清房：开门 + 发奖 + 记录 */
  _clearRoom(room) {
    // Boss 房的「清空」由 _updateBossIfAny 的兜底路径专门处理（含掉落与通关），
    // 这里直接跳过，避免 Boss 房掉出普通奖励或重复结算。
    if (room.kind === ROOM_KIND.BOSS) return;
    room.cleared = true;
    this.audio.sfxDoor();
    this.fx.floatText(ROOM_W / 2, ROOM_H / 2 - 40, '房间已清空!', {
      color: '#ffe9a3', size: 20, life: 1.4, vy: -22,
    });
    this.bus.emit(EVT.ROOM_CLEARED, room);

    // 掉落奖励：普通房有 38% 概率掉一个小拾取物
    if (room.kind === ROOM_KIND.NORMAL && room.enemies.length > 0) {
      if (this.rng.chance(0.38)) {
        const kind = this.rng.weighted({ coin: 5, heart: 2.2, bomb: 1.6, key: 1.2 });
        const spot = this._randRoomSpot(room);
        room.pickups.push({ x: spot.x, y: spot.y, kind: kind || 'coin' });
      }
    }
  }

  _randRoomSpot(room) {
    for (let i = 0; i < 40; i++) {
      const x = this.rng.range(TILE, ROOM_W - TILE);
      const y = this.rng.range(TILE, ROOM_H - TILE);
      if (!room.hitsObstacle(x, y, 16)) return { x, y };
    }
    return { x: ROOM_W / 2, y: ROOM_H / 2 };
  }

  /** 门传送检测 */
  _checkDoors(dt, room, p) {
    if (!room.cleared) return;
    const rects = room.doorRects();
    for (const r of rects) {
      if (
        p.x > r.x && p.x < r.x + r.w &&
        p.y > r.y && p.y < r.y + r.h
      ) {
        const dir = DIRS.find((d) => d.name === r.dir);
        if (!dir) continue;
        const nk = roomKey(room.gx + dir.dx, room.gy + dir.dy);
        const next = this.roomsByKey[nk];
        if (!next) continue;
        this._enterRoom(next, dir);
        return;
      }
    }
  }

  /** 切换到相邻房间 */
  _enterRoom(next, fromDir) {
    const prev = this.currentRoom;
    this.currentRoom = next;
    next.visited = true;
    next.enterGrace = 0.4;

    if (!this.visitedRooms.has(next.key)) {
      this.visitedRooms.add(next.key);
      this.visitedCount++;
      this.stats.roomsVisited = Math.max(this.stats.roomsVisited, this.visitedCount);
    }

    // 玩家从对侧门进入
    const p = this.player;
    p.vx = 0;
    p.vy = 0;
    p.invuln = Math.max(p.invuln, 0.45);
    const inset = PLAY_PAD + 14;
    switch (fromDir.opposite) {
      case 'up': p.x = ROOM_W / 2; p.y = inset; p.facing = Math.PI / 2; break;
      case 'down': p.x = ROOM_W / 2; p.y = ROOM_H - inset; p.facing = -Math.PI / 2; break;
      case 'left': p.x = inset; p.y = ROOM_H / 2; p.facing = 0; break;
      case 'right': p.x = ROOM_W - inset; p.y = ROOM_H / 2; p.facing = Math.PI; break;
    }

    // 清空上一房间的子弹（避免带弹穿门）
    this.combat.playerBullets.clear();
    this.combat.enemyBullets.clear();
    this.combat.beams.clear();
    this.fx.clear();

    this.bus.emit(EVT.ROOM_ENTERED, next);

    // Boss 房：进门时咆哮由 _updateBossIfAny 触发
    if (next.kind === ROOM_KIND.BOSS && !next.bossSpawned) {
      this.fx.floatText(ROOM_W / 2, ROOM_H / 2 - 60, '!! BOSS !!', {
        color: '#ff5a3a', size: 30, life: 1.6, vy: -14,
      });
    }
    // 宝箱房提示
    if (next.kind === ROOM_KIND.TREASURE && next.chests.some((c) => !c.opened)) {
      this.fx.floatText(ROOM_W / 2, ROOM_H / 2 - 60, '宝箱房', {
        color: '#f3c73f', size: 24, life: 1.4, vy: -16,
      });
    }
  }

  _clampPlayer(p, room) {
    const pad = p.radius + 4;

    // 未清房：严格限制在活动区内（不能穿门，这是设计意图，行为保持不变）
    if (!room.cleared) {
      p.x = clamp(p.x, PLAY_PAD + p.radius * 0.2, ROOM_W - pad);
      p.y = clamp(p.y, PLAY_PAD + p.radius * 0.2, ROOM_H - pad);
      return;
    }

    // 已清房：允许玩家走进门区（由 _checkDoors 处理传送）。
    //
    // FIX-004：原实现是「顺序 clamp」——后一句会把前一句放宽的边界重新收紧：
    //   · 右门：p.x 被 else 分支夹到 ROOM_W - pad = 607，而右门触发区起点是 610.8 → 永远差 3.8px；
    //   · 下门同理（319 vs 322.8）；
    //   · 同房间存在下门时，上门那句放宽到 -20 又被下门那句夹回 y >= pad → 上门也被封死。
    //   实测：up 56% / down 0% / left 79% / right 0%，18/36 房间全门锁死 → 流程硬卡。
    //
    // 现改为「每轴只 clamp 一次，边界取 活动区 ∪ 门洞 的并集」：
    //   · 消除顺序依赖；
    //   · 越界深度直接取自 doorRects() 的矩形边界（与 _checkDoors 触发区同源，几何永不漂移）；
    //   · span 判定使用「夹制前」的坐标，与 _checkDoors 的判定基准保持一致。
    let minX = PLAY_PAD + p.radius * 0.2;
    let maxX = ROOM_W - pad;

  const bob = Math.abs(walk) * 2.6;

  if (v.dead) { drawGaperDeath(ctx, v.dead); return; }

  groundShadow(ctx, 0, 16, 14, 6, 0.34);
  ctx.save();
  ctx.translate(0, -bob);
  ctx.rotate(lean * Math.cos(facing));

  const legSwing = walk * 3;
  for (const side of [-1, 1]) {
    const lx = side * 5.5;
    const swing = side * legSwing;
    inkShape(ctx, (c) => {
      c.moveTo(lx - 3.4, 2);
      c.quadraticCurveTo(lx - 3.4 + swing * 0.4, 8, lx - 3 + swing * 0.9, 13);
      c.lineTo(lx + 3.4 + swing * 0.9, 13);
      c.quadraticCurveTo(lx + 3.4 + swing * 0.4, 8, lx + 3.4, 2);
      c.closePath();
    }, { fill: PAL.gaperFleshShade, lineWidth: 2.6 });
    ellipse(ctx, lx + swing * 0.9, 13.5, 4.6, 2.8, { fill: PAL.gaperFlesh, lineWidth: 2.6 });
  }

  const bodyGrad = radialHighlight(ctx, 0, 0, 15, PAL.gaperFlesh, PAL.gaperFleshShade, -0.35, -0.4);
  blob(ctx, 0, -1, 14.5, GAPER_JITTER, { fill: bodyGrad, lineWidth: 3, squashY: 1.05 });
  drawGaperMouth(ctx, -1, 0, t);

  const reach = 1 + Math.sin(t * 9 + (v.phase || 0)) * 0.08;
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 13 * reach, -2);
    ctx.rotate(side * (0.5 + walk * 0.18));
    inkShape(ctx, (c) => {
      c.moveTo(0, -3);
      c.quadraticCurveTo(side * 6, 2, side * 9, 7);
      c.lineTo(side * 4, 9);
      c.quadraticCurveTo(side * 2, 4, 0, 3);
      c.closePath();
    }, { fill: PAL.gaperFlesh, lineWidth: 2.6 });
    circle(ctx, side * 9.5, 7.5, 2.4, { fill: PAL.gaperFlesh, lineWidth: 2 });
    ctx.restore();
  }
  flash(ctx, v, 26, 26);
  ctx.restore();
}

function drawGaperMouth(ctx, x, y, t) {
  const open = 0.5 + Math.abs(Math.sin(t * 6)) * 0.5;
  const rx = 9.5;
  const ry = 7.2 * open;
  inkShape(ctx, (c) => c.ellipse(x, y + 1, rx, ry, 0, 0, TAU), { fill: PAL.gaperMouth, lineWidth: 3 });
  ctx.save();
  ctx.beginPath();
  ctx.ellipse(x, y + 1, rx, ry, 0, 0, TAU);
  ctx.clip();
  ctx.fillStyle = PAL.gaperBlood;
  ctx.fillRect(x - rx, y - ry - 2, rx * 2, 3.2);
  ctx.fillRect(x - rx, y + ry - 1.2, rx * 2, 3.2);
  ctx.restore();
  ctx.save();
  ctx.fillStyle = '#f2ecd8';
  ctx.strokeStyle = PAL.ink;
  ctx.lineWidth = 1.4;
  for (let i = 0; i < 5; i++) {
    const px = x - rx + 1.6 + i * ((rx * 2 - 3.2) / 4);
    ctx.beginPath();
    ctx.moveTo(px - 1.7, y + 1 - ry + 0.5); ctx.lineTo(px + 1.7, y + 1 - ry + 0.5); ctx.lineTo(px, y + 1 - ry + 3.6); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(px - 1.7, y + 1 + ry - 0.5); ctx.lineTo(px + 1.7, y + 1 + ry - 0.5); ctx.lineTo(px, y + 1 + ry - 3.6); ctx.closePath();
    ctx.fill(); ctx.stroke();
  }
  ctx.restore();
}

function drawGaperDeath(ctx, p) {
  const e = 1 - p;
  groundShadow(ctx, 0, 16, 14 * e + 4, 6 * e + 2, 0.3 * e);
  ctx.save();
  ctx.globalAlpha = Math.min(1, e * 1.6);
  ctx.translate(0, -p * 6);
  ctx.scale(1 + (1 - e) * 0.35, Math.max(0.06, e));
  blob(ctx, 0, 0, 14, GAPER_JITTER, { fill: PAL.gaperFleshShade, lineWidth: 3, squashY: 1.05 });
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = Math.min(0.9, e);
  ctx.fillStyle = PAL.gaperBlood;
  for (let i = 0; i < 7; i++) {
    const a = (i / 7) * TAU + 0.6;
    const d = 6 + p * 20;
    const r = (2.6 + i % 3) * e;
    ctx.beginPath();
    ctx.arc(Math.cos(a) * d, Math.sin(a) * d * 0.6 - p * 8, Math.max(0.5, r), 0, TAU);
    ctx.fill();
  }
  ctx.restore();
}

// ============================================================
// Pooter —— 飞行吐弹怪
// ============================================================
function drawPooter(ctx, v = {}) {
  const t = v.t || 0;
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.pooterBody); return; }
  const hover = Math.sin(t * 3.4 + (v.phase || 0)) * 2.6;
  groundShadow(ctx, 0, 15 - hover, 12, 5, 0.24);
  ctx.save();
  ctx.translate(0, hover);
  const flap = Math.sin(t * 26 + (v.phase || 0));
  for (const side of [-1, 1]) {
    ctx.save();
    ctx.translate(side * 10, -4);
    ctx.rotate(side * (0.35 + flap * 0.5));
    inkShape(ctx, (c) => {
      c.moveTo(0, 0);
      c.quadraticCurveTo(side * 12, -9, side * 15, -1);
      c.quadraticCurveTo(side * 9, 2, side * 4, 5);
      c.closePath();
    }, { fill: PAL.pooterWing, lineWidth: 2.4 });
    ctx.restore();
  }
  const bodyGrad = radialHighlight(ctx, 0, 0, 13, PAL.pooterBody, PAL.pooterShade, -0.34, -0.4);
  blob(ctx, 0, 0, 12.5, POOTER_JITTER, { fill: bodyGrad, lineWidth: 3 });
  const eyeR = 5.2;
  circle(ctx, 0.5, -1.5, eyeR, { fill: '#ffffff', stroke: PAL.ink, lineWidth: 2.4 });
  circle(ctx, 0.5, -1.5, eyeR * 0.72, { fill: PAL.pooterEye, stroke: null });
  circle(ctx, 0.5, -1.5, eyeR * 0.4, { fill: '#5a0a0a', stroke: null });
  circle(ctx, -0.9, -3, 1.5, { fill: '#ffdede', stroke: null });
  const mouthOpen = v.shotFlash ? 4.6 : 2.6;
  inkShape(ctx, (c) => c.ellipse(0, 7.5, 3.4, mouthOpen * 0.7, 0, 0, TAU), { fill: PAL.pooterInner, lineWidth: 2.2 });
  flash(ctx, v, 24, 24);
  ctx.restore();
}

// ============================================================
// Horf —— 静止炮台怪
// ============================================================
function drawHorf(ctx, v = {}) {
  const t = v.t || 0;
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.horfBody); return; }
  ctx.save();
  const breathe = 1 + Math.sin(t * 2.6 + (v.phase || 0)) * 0.025;
  ctx.scale(breathe, breathe);
  const grad = radialHighlight(ctx, 2, -4, 18, PAL.horfBody, PAL.horfShade, -0.3, -0.38);
  inkShape(ctx, (c) => {
    c.moveTo(-16, 6);
    c.quadraticCurveTo(-17, -8, -8, -14);
    c.quadraticCurveTo(0, -17.5, 8, -14);
    c.quadraticCurveTo(17, -8, 16, 6);
    c.quadraticCurveTo(8, 11, 0, 11);
    c.quadraticCurveTo(-8, 11, -16, 6);
    c.closePath();
  }, { fill: grad, lineWidth: 3 });
  const charge = v.charge || 0;
  const holeR = 7 + charge * 1.8;
  const holeGrad = ctx.createRadialGradient(0, -3, 1, 0, -3, holeR + 2);
  holeGrad.addColorStop(0, '#000000');
  holeGrad.addColorStop(0.7, PAL.horfHole);
  holeGrad.addColorStop(1, '#5a3a24');
  inkShape(ctx, (c) => c.ellipse(0, -3, holeR, holeR * 0.86, 0, 0, TAU), { fill: holeGrad, lineWidth: 3 });
  if (charge > 0.01) {
    ctx.save();
    ctx.globalAlpha = charge * 0.9;
    ctx.shadowColor = PAL.tear;
    ctx.shadowBlur = 14 * charge;
    circle(ctx, 0, -3, 3.2 * charge + 1, { fill: PAL.tearHi, stroke: null });
    ctx.restore();
  }
  flash(ctx, v, 22, 22);
  ctx.restore();
}

// ============================================================
// Attack Fly —— 攻击苍蝇（快速飞行追击）
// ============================================================
function drawAttackFly(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.flyBody); return; }
  const t = v.t || 0;
  const hover = Math.sin(t * 9 + (v.phase || 0)) * 1.6;
  groundShadow(ctx, 0, 11 - hover, 8, 3.4, 0.24);
  ctx.save();
  ctx.translate(0, hover);
  flyBody(ctx, 8, PAL.flyBody, PAL.flyBodyShade, PAL.flyEye);
  flash(ctx, v, 16, 16);
  ctx.restore();
}

// ============================================================
// Boom Fly —— 轰炸蝇（对角飞行，死亡爆炸）
// ============================================================
function drawBoomFly(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.boomFlyBody); return; }
  const t = v.t || 0;
  const hover = Math.sin(t * 7 + (v.phase || 0)) * 2;
  groundShadow(ctx, 0, 13 - hover, 11, 4.4, 0.26);
  ctx.save();
  ctx.translate(0, hover);
  flyBody(ctx, 12, PAL.boomFlyBody, PAL.boomFlyBodyShade, '#ffd24a');
  // 引信（爆炸预示）
  ctx.save();
  ctx.globalAlpha = 0.6 + Math.sin(t * 12) * 0.3;
  ctx.fillStyle = '#ffcf5a';
  circle(ctx, 0, -13, 3, { fill: '#ffcf5a', stroke: PAL.ink, lineWidth: 1.6 });
  ctx.restore();
  flash(ctx, v, 20, 20);
  ctx.restore();
}

// ============================================================
// Charger —— 冲撞者（游走→冲刺）
// ============================================================
function drawCharger(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.fleshEnemyShade); return; }
  const t = v.t || 0;
  const dashing = v.charging;
  const lean = dashing ? 0.28 : Math.sin(t * 4 + (v.phase || 0)) * 0.06;
  groundShadow(ctx, 0, 15, 16, 6, 0.34);
  ctx.save();
  ctx.rotate(lean);
  // 身体（前倾的肉牛）
  const g = radialHighlight(ctx, -2, -4, 18, PAL.fleshEnemy, PAL.fleshEnemyShade, -0.3, -0.36);
  inkShape(ctx, (c) => {
    c.moveTo(-16, 8);
    c.bezierCurveTo(-18, -8, -8, -16, 2, -14);
    c.bezierCurveTo(14, -12, 18, 0, 14, 10);
    c.bezierCurveTo(8, 16, -10, 16, -16, 8);
    c.closePath();
  }, { fill: g, lineWidth: 3 });
  // 角
  for (const side of [-1, 1]) {
    inkShape(ctx, (c) => {
      c.moveTo(side * 8, -12);
      c.lineTo(side * 16, -18);
      c.lineTo(side * 10, -8);
      c.closePath();
    }, { fill: PAL.bone, lineWidth: 2.2 });
  }
  miniEye(ctx, -5, -6, 4, '#c02020');
  miniEye(ctx, 6, -6, 4, '#c02020');
  // 冲刺时前冲的尘土线
  if (dashing) {
    ctx.save();
    ctx.globalAlpha = 0.5;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) {
      ctx.beginPath();
      ctx.moveTo(-18 - i * 4, -4 + i * 5);
      ctx.lineTo(-26 - i * 5, -4 + i * 5);
      ctx.stroke();
    }
    ctx.restore();
  }
  flash(ctx, v, 22, 20);
  ctx.restore();
}

// ============================================================
// Clotty —— 血块（游走 + 十字弹幕）
// ============================================================
function drawClotty(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.fleshEnemyShade); return; }
  const t = v.t || 0;
  const bob = Math.abs(Math.sin(t * 6 + (v.phase || 0))) * 1.8;
  groundShadow(ctx, 0, 14, 14, 5.5, 0.32);
  ctx.save();
  ctx.translate(0, -bob);
  const g = radialHighlight(ctx, -2, -3, 15, PAL.fleshEnemy, PAL.fleshEnemyShade, -0.32, -0.38);
  blob(ctx, 0, 0, 14, BLOB_JITTER, { fill: g, lineWidth: 3 });
  // 四只小脚
  for (const side of [-1, 1]) {
    inkShape(ctx, (c) => {
      c.moveTo(side * 8, 10); c.lineTo(side * 13, 15); c.lineTo(side * 7, 15); c.closePath();
    }, { fill: PAL.fleshEnemyShade, lineWidth: 2 });
  }
  miniEye(ctx, -4, -3, 4, '#8a1f1f');
  miniEye(ctx, 5, -3, 4, '#8a1f1f');
  miniMouth(ctx, 0, 5, 6, 3.4 + (v.charge || 0) * 2.4, '#5a0a0a');
  flash(ctx, v, 20, 18);
  ctx.restore();
}

// ============================================================
// Mulligan —— 呆瓜（逃避 + 死亡召唤苍蝇）
// ============================================================
function drawMulligan(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.gaperFleshShade); return; }
  const t = v.t || 0;
  const wob = Math.sin(t * 3 + (v.phase || 0)) * 2;
  groundShadow(ctx, 0, 15, 16, 6, 0.34);
  ctx.save();
  ctx.translate(wob * 0.4, 0);
  const g = radialHighlight(ctx, -3, -4, 18, PAL.gaperFlesh, PAL.gaperFleshShade, -0.32, -0.38);
  blob(ctx, 0, 0, 16, GAPER_JITTER, { fill: g, lineWidth: 3 });
  // 脓包
  for (const [px, py, pr] of [[-8, -6, 3.4], [7, -8, 3], [10, 4, 3.2], [-10, 5, 3]]) {
    circle(ctx, px, py, pr, { fill: '#a8c070', stroke: PAL.ink, lineWidth: 1.8 });
  }
  miniEye(ctx, -5, -2, 4.4, '#8a1f1f');
  miniEye(ctx, 5, -2, 4.4, '#8a1f1f');
  miniMouth(ctx, 0, 7, 7, 4, '#4a1010');
  flash(ctx, v, 22, 20);
  ctx.restore();
}

// ============================================================
// Hopper —— 跳蚤（连续小跳）
// ============================================================
function drawHopper(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.fleshEnemyShade); return; }
  const t = v.t || 0;
  const z = v.hopZ || 0;
  const squash = z > 1 ? 1.12 : 0.88;
  groundShadow(ctx, 0, 15, 13 * (1 - Math.min(0.5, z / 60)), 5, 0.3 * (1 - Math.min(0.6, z / 80)));
  ctx.save();
  ctx.translate(0, -z);
  ctx.scale(1 / Math.sqrt(squash), squash);
  // 大脚
  for (const side of [-1, 1]) {
    ellipse(ctx, side * 8, 10, 7, 4, { fill: PAL.fleshEnemyShade, lineWidth: 2.4 });
  }
  const g = radialHighlight(ctx, -2, -4, 14, PAL.fleshEnemy, PAL.fleshEnemyShade, -0.3, -0.36);
  blob(ctx, 0, -1, 13, BLOB_JITTER, { fill: g, lineWidth: 3 });
  miniEye(ctx, -4, -4, 4, '#c02020');
  miniEye(ctx, 5, -4, 4, '#c02020');
  miniMouth(ctx, 0, 5, 5, 3, '#5a0a0a');
  flash(ctx, v, 18, 18);
  ctx.restore();
}

// ============================================================
// Trite —— 蜘蛛怪（跳跃飞行）
// ============================================================
function drawTrite(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.spiderBodyShade); return; }
  const t = v.t || 0;
  const z = v.hopZ || 0;
  groundShadow(ctx, 0, 12, 11 * (1 - Math.min(0.5, z / 60)), 4, 0.28 * (1 - Math.min(0.6, z / 80)));
  ctx.save();
  ctx.translate(0, -z);
  // 8 条腿
  ctx.strokeStyle = PAL.spiderLeg;
  ctx.lineWidth = 2.6;
  ctx.lineCap = 'round';
  const legPhase = t * 10 + (v.phase || 0);
  for (let i = 0; i < 4; i++) {
    for (const side of [-1, 1]) {
      const a = side * (0.5 + i * 0.5);
      const jig = Math.sin(legPhase + i) * 2;
      ctx.beginPath();
      ctx.moveTo(side * 4, 0);
      ctx.lineTo(side * (10 + i * 1.5), -4 + i * 4 + jig);
      ctx.lineTo(side * (16 + i * 2), 2 + i * 4 + jig);
      ctx.stroke();
    }
  }
  // 身体
  const g = radialHighlight(ctx, -2, -3, 12, PAL.spiderBody, PAL.spiderBodyShade, -0.3, -0.36);
  blob(ctx, 0, 0, 11, BLOB_JITTER, { fill: g, lineWidth: 2.8 });
  // 红眼（4 只）
  miniEye(ctx, -4, -3, 2.8, '#c02020');
  miniEye(ctx, 4, -3, 2.8, '#c02020');
  circle(ctx, -1.6, 1.5, 1.6, { fill: '#c02020', stroke: null });
  circle(ctx, 1.6, 1.5, 1.6, { fill: '#c02020', stroke: null });
  flash(ctx, v, 16, 16);
  ctx.restore();
}

// ============================================================
// Host —— 宿主（潜伏无敌，靠近后抬头射击）
// ============================================================
function drawHost(ctx, v = {}) {
  const t = v.t || 0;
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.hostShellShade); return; }
  const risen = v.risen;
  ctx.save();
  if (!risen) {
    // 潜伏态：一个贴地的壳
    groundShadow(ctx, 0, 12, 16, 6, 0.34);
    const g = radialHighlight(ctx, -2, -4, 16, PAL.hostShell, PAL.hostShellShade, -0.3, -0.36);
    inkShape(ctx, (c) => {
      c.moveTo(-15, 10);
      c.quadraticCurveTo(-16, -6, -8, -10);
      c.quadraticCurveTo(0, -12, 8, -10);
      c.quadraticCurveTo(16, -6, 15, 10);
      c.quadraticCurveTo(0, 14, -15, 10);
      c.closePath();
    }, { fill: g, lineWidth: 3 });
    // 缝隙
    ctx.strokeStyle = 'rgba(60,40,20,0.6)';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-10, 0); ctx.quadraticCurveTo(0, 4, 10, 0);
    ctx.stroke();
  } else {
    // 抬头态：肉茎 + 头
    groundShadow(ctx, 0, 14, 14, 5.5, 0.32);
    inkShape(ctx, (c) => {
      c.moveTo(-7, 12); c.lineTo(7, 12); c.lineTo(5, -2); c.lineTo(-5, -2); c.closePath();
    }, { fill: PAL.hostMeat, lineWidth: 2.6 });
    const g = radialHighlight(ctx, -2, -10, 15, PAL.hostMeat, PAL.hostShellShade, -0.3, -0.36);
    circle(ctx, 0, -10, 12, { fill: g, stroke: PAL.ink, lineWidth: 3 });
    miniEye(ctx, -4, -12, 3.6, '#c02020');
    miniEye(ctx, 4, -12, 3.6, '#c02020');
    miniMouth(ctx, 0, -5, 6, 3.4 + (v.charge || 0) * 2.4, '#5a0a0a');
  }
  flash(ctx, v, 20, 18);
  ctx.restore();
}

// ============================================================
// Vis —— 激光眼（蓄力后发射光束）
// ============================================================
function drawVis(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.visBodyShade); return; }
  const t = v.t || 0;
  const charging = v.laserCharging;
  const bob = Math.sin(t * 3 + (v.phase || 0)) * 2;
  groundShadow(ctx, 0, 14, 14, 5.5, 0.3);
  ctx.save();
  ctx.translate(0, -bob);
  // 躯体（机械肉块）
  const g = radialHighlight(ctx, -2, -3, 15, PAL.visBody, PAL.visBodyShade, -0.3, -0.36);
  inkShape(ctx, (c) => {
    c.moveTo(-13, 8);
    c.quadraticCurveTo(-15, -8, 0, -12);
    c.quadraticCurveTo(15, -8, 13, 8);
    c.quadraticCurveTo(0, 13, -13, 8);
    c.closePath();
  }, { fill: g, lineWidth: 3 });
  // 金属板
  ctx.strokeStyle = '#9aa0aa';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-9, -4); ctx.lineTo(9, -4);
  ctx.stroke();
  // 大镜头眼
  const lensGlow = charging ? 1 : 0.5 + Math.sin(t * 4) * 0.2;
  ctx.save();
  ctx.shadowColor = PAL.visLens;
  ctx.shadowBlur = 8 * lensGlow;
  circle(ctx, 0, -3, 6.4, { fill: '#2a2e34', stroke: PAL.ink, lineWidth: 2.4 });
  circle(ctx, 0, -3, 3.8 * (charging ? 1.15 : 1), { fill: PAL.visLens, stroke: null });
  ctx.restore();
  circle(ctx, -1.4, -4.6, 1.4, { fill: '#ffdcc0', stroke: null });
  flash(ctx, v, 18, 18);
  ctx.restore();
}

// ============================================================
// Maw —— 巨口（漂浮追踪弹）
// ============================================================
function drawMaw(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.mawShade); return; }
  const t = v.t || 0;
  const hover = Math.sin(t * 2.8 + (v.phase || 0)) * 3;
  groundShadow(ctx, 0, 15 - hover, 13, 5, 0.26);
  ctx.save();
  ctx.translate(0, hover);
  const g = radialHighlight(ctx, -2, -3, 16, PAL.mawBody, PAL.mawShade, -0.3, -0.36);
  blob(ctx, 0, -2, 14, BLOB_JITTER, { fill: g, lineWidth: 3 });
  // 大嘴（占满下半）
  const open = 0.5 + (v.charge || 0) * 0.5;
  inkShape(ctx, (c) => c.ellipse(0, 4, 11, 5 + open * 5, 0, 0, TAU), { fill: PAL.mawInner, lineWidth: 2.8 });
  ctx.save();
  ctx.fillStyle = '#f2ecd8';
  for (let i = 0; i < 5; i++) {
    const px = -9 + i * 4.5;
    ctx.beginPath();
    ctx.moveTo(px - 1.6, 4 - (5 + open * 5)); ctx.lineTo(px + 1.6, 4 - (5 + open * 5)); ctx.lineTo(px, 4 - (5 + open * 5) + 3.4); ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
  miniEye(ctx, -5, -8, 3.6, '#8a1f5f');
  miniEye(ctx, 5, -8, 3.6, '#8a1f5f');
  flash(ctx, v, 20, 20);
  ctx.restore();
}

// ============================================================
// Globin —— 血球蛋白（死亡后复活一次）
// ============================================================
function drawGlobin(ctx, v = {}) {
  if (v.dead) { drawPopDeath(ctx, v.dead, PAL.globinShade); return; }
  const t = v.t || 0;

  // ---- 静音提示（M 键切换）----
  if (g.audioMuted) {
    strokedText(ctx, '已静音  ·  按 M 恢复', W / 2, g._h - 14, {
      font: `bold 14px ${FONT_UI}`, fill: '#c88a6a', lineWidth: 3, align: 'center',
    });
  }
}

/**
 * 左下角「角色属性面板」。
 *
 * 中文标签 + 放大版式（相对旧版：条宽 62→80、条高 7→10、行高 15→20、字号 10→13）。
 * 位置策略：默认贴底（左下角，桌面端所见即所得）；在**触屏且高视口**（H ≥ 560）下，
 * 面板会整体移到移动摇杆**下方**，避免与摇杆底盘重叠 —— 摇杆位于 0.78H、半径 52
 * （见 ui/joystick.js），矮视口（横屏）维持旧行为不变。
 */
function drawStatBars(ctx, x, g) {
  const p = g.player;
  const stats = [
    { key: 'damage', label: '伤害', color: '#e05a4a' },
    { key: 'fireDelay', label: '射速', color: '#e0a83a' },
    { key: 'speed', label: '移速', color: '#4aa3e0' },
    { key: 'range', label: '射程', color: '#9b6bd6' },
    { key: 'shotSpeed', label: '弹速', color: '#3ac0a0' },
  ];
  const labelW = 40; // 中文标签列宽（两字 × 13px + 间距）
  const bw = 80; // 属性条宽
  const bh = 10; // 属性条高
  const lineH = 20; // 行高
  const padX = 10;
  const padY = 9;
  const panelW = labelW + bw + padX * 2;
  const panelH = padY * 2 + stats.length * lineH - (lineH - bh);

  // 面板底边
  let bottom = g._h - 46;
  const touch = !!(g.input && (g.input.touchCapable || g.input.usingTouch));
  if (touch && g._h >= 560) {
    const stickBottom = g._h * 0.78 + 52; // 摇杆底盘下沿
    bottom = stickBottom + 10 + panelH <= g._h - 8
      ? stickBottom + 10 + panelH // 摇杆下方有空间 → 整体下移
      : Math.min(bottom, g._h * 0.78 - 52 - 10); // 否则上移到摇杆上方
  }
  const panelX = x - padX;
  const panelY = bottom - panelH;

  // 半透明底板 + 细边框（提高面板在浅色地砖上的可读性）
  ctx.save();
  ctx.globalAlpha = 0.62;
  roundRect(ctx, panelX, panelY, panelW, panelH, 8, { fill: PAL.uiBg, stroke: null });
  ctx.restore();
  ctx.save();
  ctx.globalAlpha = 0.32;
  roundRect(ctx, panelX, panelY, panelW, panelH, 8, { fill: null, stroke: PAL.uiTextDim, lineWidth: 1.5 });
  ctx.restore();

  let rowTop = panelY + padY;
  for (const s of stats) {
    const bx = x + labelW;
    ctx.save();
    roundRect(ctx, bx, rowTop, bw, bh, 4, { fill: PAL.uiBarBg, stroke: PAL.ink, lineWidth: 1.8 });
    const v = statBar(s.key, p.stats[s.key]);
    if (v > 0.01) {
      roundRect(ctx, bx + 1.5, rowTop + 1.5, Math.max(3, (bw - 3) * v), bh - 3, 3, { fill: s.color, stroke: null });
    }
    ctx.restore();
    strokedText(ctx, s.label, x, rowTop + bh * 0.5 + 4.5, {
      font: `bold 13px ${FONT_UI}`, fill: PAL.uiText, lineWidth: 3,
    });
    rowTop += lineH;
  }
}

/**
 * 小地图：右上角，显示已探索房间格与连接
 * @param {number} x 右侧锚点（右对齐）
 * @param {number} y 顶部锚点
 */
function drawMinimap(ctx, g, x, y) {
  if (!g.dungeon) return;
  const cell = 15;
  const gap = 3;
  const rooms = g.dungeon.rooms;
  // 计算包围盒
  let minGX = Infinity, maxGX = -Infinity, minGY = Infinity, maxGY = -Infinity;
  for (const r of rooms) {
    minGX = Math.min(minGX, r.gx);
    maxGX = Math.max(maxGX, r.gx);
    minGY = Math.min(minGY, r.gy);
    maxGY = Math.max(maxGY, r.gy);
  }
  const cols = maxGX - minGX + 1;
  const rows = maxGY - minGY + 1;
  const mapW = cols * (cell + gap) - gap;
  const mapH = rows * (cell + gap) - gap;

  const ox = x - mapW;
  const oy = y;

  // 底板
  ctx.save();
  roundRect(ctx, ox - 8, oy - 6, mapW + 16, mapH + 12, 6, {
    fill: PAL.mapBg, stroke: 'rgba(200,180,150,0.3)', lineWidth: 1.5,
  });
  ctx.restore();

  // 房间
  for (const r of rooms) {
    const rx = ox + (r.gx - minGX) * (cell + gap);
    const ry = oy + (r.gy - minGY) * (cell + gap);
    const isCur = g.currentRoom && g.currentRoom.key === r.key;
    const isVisited = g.visitedRooms.has(r.key);

    let fill = PAL.mapRoom;
    if (isCur) fill = PAL.mapRoomCur;
    else if (r.kind === 'boss' && isVisited) fill = PAL.mapRoomBoss;
    else if (r.kind === 'treasure' && isVisited) fill = PAL.mapRoomTreasure;
    else if (isVisited) fill = r.cleared ? PAL.mapRoomClear : '#6a5f64';

    ctx.save();
    // 未访问的房间：不显示（原作是走过后才显示）
    if (!isVisited && !isCur) {
      ctx.globalAlpha = 0;
    }
    roundRect(ctx, rx, ry, cell, cell, 2.5, {
      fill, stroke: isCur ? '#fff' : 'rgba(20,10,10,0.8)', lineWidth: isCur ? 2 : 1.4,
    });
    // boss 房标记
    if (isVisited && r.kind === 'boss' && !isCur) {
      strokedText(ctx, '☠', rx + cell / 2, ry + cell * 0.76, {
        font: 'bold 11px sans-serif', fill: '#fff', stroke: null, align: 'center',
      });
    }
    if (isVisited && r.kind === 'treasure' && !isCur) {
      circle(ctx, rx + cell / 2, ry + cell / 2, 3, { fill: PAL.itemGold, stroke: '#5a3a10', lineWidth: 1 });
    }
    // 门（连向右侧/下方邻居，避免重复绘制）
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = PAL.mapDoor;
    if (r.doors.right && g.dungeon.byKey[`${r.gx + 1},${r.gy}`]) {
      ctx.fillRect(rx + cell, ry + cell / 2 - 1.5, gap, 3);
    }
    if (r.doors.down && g.dungeon.byKey[`${r.gx},${r.gy + 1}`]) {
      ctx.fillRect(rx + cell / 2 - 1.5, ry + cell, 3, gap);
    }
    ctx.restore();
  }
}

/**
 * 道具拾取面板
 * @param {number} t 0..1 出现进度
 */
function drawItemPanel(ctx, W, H, item, t) {
  if (!item) return;
  const ease = t < 0.5 ? t * 2 : 1 - (t - 0.5) * 2 * 0.02; // 快速弹出后保持
  const age = Math.min(1, t * 3);

  const pw = 420;
  const ph = 132;
  const px = W / 2 - pw / 2;
  const py = H * 0.5 - ph / 2 - (1 - age) * 30;

  ctx.save();
  ctx.globalAlpha = age;

  // 阴影 + 面板
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.6)';
  ctx.shadowBlur = 20;
  roundRect(ctx, px, py, pw, ph, 10, { fill: PAL.uiPanel, stroke: '#0d0a0c', lineWidth: 3 });
  ctx.restore();
  // 顶部高光
  roundRect(ctx, px + 3, py + 3, pw - 6, 26, 8, { fill: PAL.uiPanelHi, stroke: null });
  // 金色描边
  roundRect(ctx, px + 1.5, py + 1.5, pw - 3, ph - 3, 9, { fill: null, stroke: PAL.itemGold, lineWidth: 2 });

  // 图标
  const iconCX = px + 62;
  const iconCY = py + ph / 2 + 6;
  circle(ctx, iconCX, iconCY, 38, { fill: 'rgba(20,16,18,0.9)', stroke: PAL.itemGold, lineWidth: 2.6 });
  ctx.save();
  ctx.translate(iconCX, iconCY);
  ctx.scale(1.7, 1.7);
  const fn = ITEM_ICONS[item.id] || ITEM_ICONS['tear'];
  fn(ctx);
  ctx.restore();

  // 文本
  strokedText(ctx, '拾取道具', px + 118, py + 26, {
    font: 'bold 12px "Trebuchet MS",sans-serif', fill: PAL.uiGold, lineWidth: 3,
  });
  const nameFont = 'bold 24px "Trebuchet MS",sans-serif';
  strokedText(ctx, item.name, px + 118, py + 54, {
    font: nameFont, fill: PAL.uiText, lineWidth: 4,
  });
  // 中文名紧跟英文名右侧：必须用「与英文名相同的字体」测量宽度。
  // 注意 strokedText 内部 save/restore，不会把 font 留在 ctx 上，
  // 所以这里必须先显式设置 ctx.font 再 measureText，否则宽度会失真导致文字重叠。
  ctx.save();
  ctx.font = nameFont;
  const nameW = ctx.measureText(item.name).width;
  ctx.restore();
  strokedText(ctx, item.nameZh, px + 118 + nameW + 14, py + 54, {
    font: 'bold 15px "Trebuchet MS",sans-serif', fill: PAL.uiTextDim, lineWidth: 3,
  });
  // 描述自动换行
  wrapText(ctx, item.desc, px + 118, py + 82, pw - 136, 20, {
    font: '15px "Trebuchet MS",sans-serif', fill: '#d8ccb4', lineWidth: 3,
  });

  ctx.restore();
}

/** 简易文本换行 */
function wrapText(ctx, text, x, y, maxW, lineH, style) {
  ctx.save();
  ctx.font = style.font;
  const chars = text.split('');
  let line = '';
  let yy = y;
  for (const ch of chars) {
    const test = line + ch;
    if (ctx.measureText(test).width > maxW && line !== '') {
      strokedText(ctx, line, x, yy, style);
      line = ch;
      yy += lineH;
    } else {
      line = test;
    }
  }
  if (line) strokedText(ctx, line, x, yy, style);
  ctx.restore();
  return yy;
}

/** 受伤红屏 */
function drawDamageFlash(ctx, W, H, amount) {
  if (amount <= 0.01) return;
  ctx.save();
  const g = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.2, W / 2, H / 2, Math.max(W, H) * 0.62);
  g.addColorStop(0, 'rgba(150,10,10,0)');
  g.addColorStop(1, `rgba(160,5,5,${Math.min(0.72, amount * 0.72)})`);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

/** 标题按钮（返回其矩形用于命中检测） */
function drawButton(ctx, x, y, w, h, label, opts = {}) {
  const hover = !!opts.hover;
  const primary = !!opts.primary;
  const bg = primary
    ? (hover ? '#d94a3a' : PAL.uiAccent)
    : (hover ? '#3a2e34' : PAL.uiPanel);
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.5)';
  ctx.shadowBlur = hover ? 12 : 6;
  ctx.shadowOffsetY = 2;
  roundRect(ctx, x, y, w, h, 8, { fill: bg, stroke: PAL.ink, lineWidth: 3 });
  ctx.restore();
  roundRect(ctx, x + 2, y + 2, w - 4, h * 0.42, 6, {
    fill: 'rgba(255,255,255,0.12)', stroke: null,
  });
  strokedText(ctx, label, x + w / 2, y + h / 2 + 7, {
    font: 'bold 20px "Trebuchet MS",sans-serif',
    fill: PAL.uiText,
    lineWidth: 4,
    align: 'center',
  });
  return { x, y, w, h };
}

/** 通用全屏遮罩。tint 为不含 alpha、不含右括号的 rgba 前缀。 */
function drawScreenDim(ctx, W, H, alpha = 0.82, tint = 'rgba(8,6,8,') {
  ctx.save();
  ctx.fillStyle = tint + alpha + ')';
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
/** 标题艺术字（带血渍感的描边大字） */
function drawTitle(ctx, text, x, y, size, opts = {}) {
  ctx.save();
  ctx.font = opts.font || `bold ${size}px "Trebuchet MS", Impact, sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.lineJoin = 'round';
  // 多层描边制造厚度
  ctx.lineWidth = size * 0.16;
  ctx.strokeStyle = '#0d0808';
  ctx.strokeText(text, x, y);
  ctx.lineWidth = size * 0.08;
  ctx.strokeStyle = opts.stroke || '#5a1414';
  ctx.strokeText(text, x, y);
  // 填充渐变
  const g = ctx.createLinearGradient(0, y - size * 0.5, 0, y + size * 0.5);
  g.addColorStop(0, opts.top || '#f0e0c0');
  g.addColorStop(0.55, opts.mid || '#d8b070');
  g.addColorStop(1, opts.bottom || '#8a5a2a');
  ctx.fillStyle = g;
  ctx.fillText(text, x, y);
  // 顶部高光
  ctx.globalAlpha = 0.35;
  ctx.fillStyle = '#ffffff';
  ctx.fillText(text, x, y - 2);
  ctx.restore();
}
